name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROLELENS_PRODUCTION_URL: ${{ vars.ROLELENS_PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ROLELENS_PRODUCTION_URL" || (echo "Missing repository variable: ROLELENS_PRODUCTION_URL" && exit 1)

      - name: Validate Cloudflare runtime secrets
        run: |
          set -euo pipefail

          npx wrangler secret list > /tmp/rolelens-worker-secrets.txt
          grep -q "AUTH_PASSWORD_PEPPER" /tmp/rolelens-worker-secrets.txt || (
            echo "Missing Cloudflare Worker secret: AUTH_PASSWORD_PEPPER"
            echo "Set it with: npx wrangler secret put AUTH_PASSWORD_PEPPER"
            exit 1
          )
          grep -q "CRON_SECRET" /tmp/rolelens-worker-secrets.txt || (
            echo "Missing Cloudflare Worker secret: CRON_SECRET"
            echo "Set it with: npx wrangler secret put CRON_SECRET"
            exit 1
          )
          grep -q "SYNC_ADMIN_EMAILS" /tmp/rolelens-worker-secrets.txt || (
            echo "Missing Cloudflare Worker secret: SYNC_ADMIN_EMAILS"
            echo "Set it with: npx wrangler secret put SYNC_ADMIN_EMAILS"
            exit 1
          )

      - name: Build Worker output
        run: npm run cf:build

      - name: Apply D1 migrations
        run: npm run db:schema:prod

      - name: Deploy to Cloudflare Workers
        run: npm run cf:deploy

      - name: Verify deployed Worker status
        run: |
          set -euo pipefail

          DEPLOYMENT=$(npx wrangler deployments status --name rolelens --json)
          echo "$DEPLOYMENT" | jq --exit-status '
            .source == "wrangler"
            and (.versions | length > 0)
            and ([.versions[].percentage] | add == 100)
          ' >/dev/null
