name = "rolelens"
main = ".open-next/worker.js"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "rolelens"

# Credentials remain encrypted in Hyperdrive and are never stored here.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "2c0633de6ecb4e90aa7de666ceeb66c6"
# OpenNext loads Cloudflare bindings while running `next build`. This local-only
# placeholder satisfies Hyperdrive emulation without exposing production credentials.
localConnectionString = "postgresql://postgres:postgres@127.0.0.1:5432/postgres"

[vars]
PERSISTENCE_BACKEND = "postgres"
PERSISTENCE_DATABASE_BINDING = "HYPERDRIVE"
AUTH_BACKEND = "postgres"
