name = "rolelens"
main = ".open-next/worker.js"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "rolelens"

[[d1_databases]]
binding = "DB"
database_name = "rolelens-db"
database_id = "bb959e06-5523-4c26-a12d-55113fac9cc2"
preview_database_id = "bb959e06-5523-4c26-a12d-55113fac9cc2"

[vars]
PERSISTENCE_BACKEND = "d1"
PERSISTENCE_D1_BINDING = "DB"
AUTH_BACKEND = "d1"
